<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generated" content="{{GENERATED_DATE}}">
    <title>{{NAME}} - {{LABEL}}</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1 class="name">{{NAME}}</h1>
            {{LABEL_DISPLAY}}
            <div class="contact-info">
                {{EMAIL_DISPLAY}}
                {{PHONE_DISPLAY}}
                {{URL_DISPLAY}}
                {{LOCATION_DISPLAY}}
            </div>
            {{PROFILES}}
        </div>
    </header>

    {{SUMMARY_DISPLAY}}

    {{WORK}}
    {{EDUCATION}}
    {{SKILLS}}
    {{PROJECTS}}
    {{CERTIFICATES}}
    {{LANGUAGES}}
    {{AWARDS}}

    <footer class="main-footer">
        <p class="generated-at">Generated on {{GENERATED_DATE}}</p>
    </footer>
</body>
</html>
